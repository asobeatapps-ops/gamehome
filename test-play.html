<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASOBEAT 通信テスト</title>
</head>
<body style="font-family:sans-serif;padding:24px">
<h2>ASOBEAT プレイ数テスト</h2>
<button id="send" style="padding:16px;font-size:18px">テスト送信</button>
<pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
<script>
document.getElementById('send').addEventListener('click', async () => {
  const result = document.getElementById('result');
  result.textContent = '送信中...';
  try {
    const response = await fetch('https://asobeat-play-counter.asobeat-apps.workers.dev/play', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({gameId:'asobeat_test'})
    });
    result.textContent = 'HTTP ' + response.status + '\n' + await response.text();
  } catch (error) {
    result.textContent = '通信エラー: ' + error.message;
  }
});
</script>
</body>
</html>
